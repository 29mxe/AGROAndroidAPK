name: Build AgroConnect Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://lilac-bottle.vibecode.run
      EXPO_PUBLIC_VIBECODE_BACKEND_URL: https://lilac-bottle.vibecode.run

    steps:
      - name: Free disk space
        shell: bash
        run: |
          echo "Disk before cleanup"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "Disk after cleanup"
          df -h

      - name: Get source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify build-safe project
        working-directory: mobile
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('package.json').read_text())
          deps = {**data.get('dependencies', {}), **data.get('devDependencies', {})}
          forbidden = [
              'expo-network-addons',
              '@react-native-menu/menu',
              'zeego',
              'react-native-purchases',
              'react-native-purchases-ui',
              'expo-dev-client',
          ]
          present = [p for p in forbidden if p in deps]
          if present:
              raise SystemExit('Unsafe dependencies are still present: ' + ', '.join(present))
          if data.get('patchedDependencies'):
              raise SystemExit('patchedDependencies must be empty for this standalone build')
          print('Build-safe dependency check: OK')
          PY

      - name: Install dependencies
        working-directory: mobile
        run: bun install

      - name: Prepare Android project
        working-directory: mobile
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Optimize Android build
        working-directory: mobile/android
        shell: bash
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a\n' >> gradle.properties
          printf 'org.gradle.caching=false\n' >> gradle.properties
          printf 'org.gradle.daemon=false\n' >> gradle.properties
          printf 'org.gradle.parallel=false\n' >> gradle.properties
          printf 'org.gradle.workers.max=2\n' >> gradle.properties
          printf 'android.enableMinifyInReleaseBuilds=false\n' >> gradle.properties
          printf 'android.enableShrinkResourcesInReleaseBuilds=false\n' >> gradle.properties
          df -h

      - name: Build standalone Release APK
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          NODE_ENV=production ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --stacktrace

      - name: Find and verify APK
        shell: bash
        run: |
          APK_FILE=$(find mobile/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK was not created"
            exit 1
          fi
          if ! unzip -l "$APK_FILE" | grep -q 'assets/index.android.bundle'; then
            echo "ERROR: JavaScript bundle is not embedded in the APK"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_FILE" artifacts/AgroConnect-v1.2.apk
          echo "APK_FILE=artifacts/AgroConnect-v1.2.apk" >> "$GITHUB_ENV"
          ls -lh artifacts/AgroConnect-v1.2.apk
          sha256sum artifacts/AgroConnect-v1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgroConnect-v1.2-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7
